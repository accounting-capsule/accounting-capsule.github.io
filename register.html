<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#0a1628">
    <meta name="description" content="إنشاء حساب جديد في كبسولة المحاسب - منصة الحلول المحاسبية الاحترافية">
    <title>إنشاء حساب | كبسولة المحاسب</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">
                    <i class="fas fa-capsules"></i>
                </div>
                <h1>إنشاء حساب جديد</h1>
                <p>انضم لأكثر من 10,000 محاسب</p>
            </div>

            <div class="auth-body">
                <!-- Social Login -->
                <div class="social-login">
                    <button class="btn-social google">
                        <i class="fab fa-google"></i>
                        <span>التسجيل بحساب Google</span>
                    </button>
                </div>

                <div class="divider">أو</div>

                <!-- Register Form -->
                <form data-validate>
                    <div class="form-group">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" class="form-input" placeholder="محمد أحمد" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">البريد الإلكتروني</label>
                        <input type="email" class="form-input" placeholder="example@email.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <div style="position: relative;">
                            <input type="password" class="form-input" placeholder="••••••••" required minlength="8">
                            <button type="button" class="toggle-password" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gray-400); cursor: pointer;">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <p style="font-size: 0.75rem; color: var(--gray-400); margin-top: 0.25rem;">8 أحرف على الأقل</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">تأكيد كلمة المرور</label>
                        <input type="password" class="form-input" placeholder="••••••••" required>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: flex; align-items: flex-start; gap: 0.5rem; cursor: pointer; font-size: 0.8125rem; color: var(--gray-600); line-height: 1.6;">
                            <input type="checkbox" required style="width: 16px; height: 16px; accent-color: var(--primary-600); margin-top: 2px;">
                            <span>أوافق على <a href="terms.html" style="color: var(--primary-600);">شروط الاستخدام</a> و <a href="privacy.html" style="color: var(--primary-600);">سياسة الخصوصية</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-full" style="padding: 0.875rem;">
                        <i class="fas fa-user-plus"></i>
                        إنشاء الحساب
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                <p>عندك حساب بالفعل؟ <a href="login.html">سجل دخول</a></p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });
    </script>
</body>
</html>
