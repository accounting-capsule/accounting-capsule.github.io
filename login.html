<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#0a1628">
    <meta name="description" content="تسجيل الدخول إلى كبسولة المحاسب - منصة الحلول المحاسبية الاحترافية">
    <title>تسجيل الدخول | كبسولة المحاسب</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">
                    <i class="fas fa-capsules"></i>
                </div>
                <h1>تسجيل الدخول</h1>
                <p>أهلاً بيك في كبسولة المحاسب</p>
            </div>

            <div class="auth-body">
                <!-- Social Login -->
                <div class="social-login">
                    <button class="btn-social google">
                        <i class="fab fa-google"></i>
                        <span>الدخول بحساب Google</span>
                    </button>
                </div>

                <div class="divider">أو</div>

                <!-- Login Form -->
                <form data-validate>
                    <div class="form-group">
                        <label class="form-label">البريد الإلكتروني</label>
                        <input type="email" class="form-input" placeholder="example@email.com" required>
                        <span class="error-message" style="display: none; color: var(--red-500); font-size: 0.8125rem; margin-top: 0.25rem;"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <div style="position: relative;">
                            <input type="password" class="form-input" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gray-400); cursor: pointer;">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" style="display: none; color: var(--red-500); font-size: 0.8125rem; margin-top: 0.25rem;"></span>
                    </div>

                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem; color: var(--gray-600);">
                            <input type="checkbox" style="width: 16px; height: 16px; accent-color: var(--primary-600);">
                            تذكرني
                        </label>
                        <a href="#" style="font-size: 0.875rem; color: var(--primary-600); font-weight: 600;">نسيت كلمة المرور؟</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-full" style="padding: 0.875rem;">
                        <i class="fas fa-sign-in-alt"></i>
                        تسجيل الدخول
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                <p>مش عندك حساب؟ <a href="register.html">سجل مجاناً</a></p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Password toggle
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });
    </script>
</body>
</html>
