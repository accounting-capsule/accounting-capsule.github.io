backend:
  name: github
  repo: accounting-capsule/accounting-capsule.github.io
  branch: main
  base_url: https://sveltia-cms-auth-capsule.1d9sxh.workers.dev
  auth_methods: [oauth]

site_url: https://accounting-capsule.github.io
display_url: https://accounting-capsule.github.io
locale: ar

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: notes
    label: ملاحظات الإدارة (لا تظهر للزوار)
    folder: admin-data/notes
    format: json
    extension: json
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    fields:
      - { name: title, label: العنوان, widget: string }
      - { name: body, label: النص, widget: text }

  - name: articles
    label: المقالات (تعديل مباشر)
    label_singular: مقال
    folder: articles
    extension: html
    format: frontmatter
    create: false
    delete: false
    identifier_field: headline
    summary: "{{headline}}"
    sortable_fields: [headline, mod_date]
    fields:
      - { name: layout, widget: hidden }
      - { name: rest, widget: hidden }
      - { name: headline, label: عنوان المقال (يظهر في الصفحة), widget: string }
      - { name: title, label: عنوان التبويب والبحث (SEO), widget: string }
      - { name: description, label: الوصف (يظهر في جوجل), widget: text }
      - { name: cat, label: التصنيف, widget: string }
      - { name: crumb, label: اسم القسم في شريط التنقل, widget: string }
      - { name: pub_date, label: تاريخ النشر (YYYY-MM-DD), widget: string }
      - { name: mod_date, label: تاريخ آخر تعديل (YYYY-MM-DD), widget: string }
      - { name: meta, label: سطر التاريخ ووقت القراءة (HTML), widget: text }
      - { name: body, label: نص المقال (HTML), widget: text }
